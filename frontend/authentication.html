<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#ff7a18" />
  <meta name="description" content="Nebulon — Member Access Authentication & Secure Account Setup." />
  <title>Nebulon | Authentication</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;700;800&display=swap" rel="stylesheet" />

  <!-- Auth Design System -->
  <link rel="stylesheet" href="css/authentication.css" />
</head>

<body class="neb-auth-body">
  <!-- Background 3D Video Loop -->
  <div class="auth-video-bg" style="position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden;">
    <video autoplay muted loop playsinline preload="metadata" style="width: 100%; height: 100%; object-fit: cover; opacity: 0.92; filter: saturate(1.15) brightness(1.05);" aria-hidden="true">
      <source src="assets/video/auth-loop.mp4" type="video/mp4" />
    </video>
  </div>

  <!-- Interactive Radar Grid & Hexagonal Lock Background Canvas -->
  <canvas id="neb-auth-bg-canvas"></canvas>

  <main class="neb-auth-card">
    <div class="neb-auth-brand">NEBULON</div>
    <div class="neb-auth-flare"></div>

    <div class="neb-auth-kicker">MEMBER ACCESS</div>
    <h1 class="neb-auth-title">AUTHENTICATION</h1>

    <div class="neb-auth-divider-line">SECURE ACCOUNT SETUP</div>

    <!-- Step Progress Tracker: 01 ACCOUNT -> 02 VERIFY -->
    <div class="neb-step-tracker">
      <div class="neb-step-line"></div>
      <div class="neb-step-item is-active">
        <span class="neb-step-num">01</span>
        <span class="neb-step-label">ACCOUNT</span>
        <div class="neb-step-dot"></div>
      </div>
      <div class="neb-step-item">
        <span class="neb-step-num">02</span>
        <span class="neb-step-label">VERIFY</span>
        <div class="neb-step-dot"></div>
      </div>
    </div>

    <!-- Form Inputs -->
    <form id="neb-step1-form" action="member_login.html">
      <div class="neb-field-group">
        <label class="neb-field-label" for="neb-uid">USER ID</label>
        <div class="neb-input-box">
          <span class="neb-input-icon">👤</span>
          <input 
            type="text" 
            id="neb-uid" 
            class="neb-input-control" 
            placeholder="Enter your fixed User ID" 
            value="nebulon"
            autocomplete="off" 
            required 
          />
        </div>
      </div>

      <div class="neb-field-group">
        <label class="neb-field-label" for="neb-pwd">PASSWORD</label>
        <div class="neb-input-box">
          <span class="neb-input-icon">🔒</span>
          <input 
            type="password" 
            id="neb-pwd" 
            class="neb-input-control" 
            placeholder="Enter your fixed password" 
            value="nebulon@2070"
            autocomplete="off" 
            required 
          />
          <button type="button" class="neb-pwd-toggle" id="neb-pwd-toggle-btn" title="Toggle password visibility">
            👁
          </button>
        </div>
      </div>

      <label class="neb-remember-row">
        <input type="checkbox" id="neb-remember-device" checked />
        <span>REMEMBER THIS DEVICE</span>
      </label>

      <div id="neb-auth-error" class="neb-error-banner" style="display: none;"></div>

      <button type="button" class="neb-btn-primary" id="neb-btn-continue">
        <span>CONTINUE TO VERIFICATION</span>
        <span style="font-size: 1.1rem; line-height: 1;">›</span>
      </button>

      <button type="button" class="neb-btn-secondary" id="neb-btn-request">
        REQUEST ACCESS
      </button>
    </form>

    <div class="neb-auth-footer">
      <span>🔒</span>
      <span>SECURE CHANNEL / END-TO-END ENCRYPTED</span>
    </div>
  </main>

  <script src="js/authentication.js"></script>
  <script>
    // Password Visibility Toggle
    const pwdInput = document.getElementById('neb-pwd');
    const pwdToggle = document.getElementById('neb-pwd-toggle-btn');
    if (pwdToggle && pwdInput) {
      pwdToggle.addEventListener('click', function (e) {
        e.preventDefault();
        if (pwdInput.type === 'password') {
          pwdInput.type = 'text';
          pwdToggle.textContent = '🔒';
        } else {
          pwdInput.type = 'password';
          pwdToggle.textContent = '👁';
        }
      });
    }

    // Direct and reliable step transition
    function proceedToStep2() {
      const uid = (document.getElementById('neb-uid').value || 'nebulon').trim();
      const pwd = (document.getElementById('neb-pwd').value || 'nebulon@2070').trim();
      
      sessionStorage.setItem('nebulon_step1_cleared', 'true');
      sessionStorage.setItem('nebulon_step1_time', new Date().toISOString());
      sessionStorage.setItem('nebulon_preferred_uid', uid);
      sessionStorage.setItem('nebulon_preferred_pwd', pwd);

      window.location.href = 'member_login.html';
    }

    document.getElementById('neb-btn-continue').addEventListener('click', proceedToStep2);
    document.getElementById('neb-step1-form').addEventListener('submit', function (e) {
      e.preventDefault();
      proceedToStep2();
    });

    document.getElementById('neb-btn-request').addEventListener('click', function (e) {
      e.preventDefault();
      document.getElementById('neb-uid').value = 'nebulon';
      document.getElementById('neb-pwd').value = 'nebulon@2070';
      proceedToStep2();
    });

    // Canvas Background: Concentric Coordinate Radar Rings & Floating Hexagonal Lock Badge
    (function () {
      const canvas = document.getElementById('neb-auth-bg-canvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      let w, h, angle = 0;

      function resize() {
        w = canvas.width = window.innerWidth;
        h = canvas.height = window.innerHeight;
      }
      window.addEventListener('resize', resize);
      resize();

      function render() {
        ctx.clearRect(0, 0, w, h);
        const cx = w * 0.5;
        const cy = h * 0.5;
        const maxR = Math.max(w, h) * 0.55;

        // 1. Subtle Circuit Grid
        ctx.strokeStyle = 'rgba(255, 122, 24, 0.03)';
        ctx.lineWidth = 1;
        const gridSize = 40;
        for (let x = 0; x < w; x += gridSize) {
          ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke();
        }
        for (let y = 0; y < h; y += gridSize) {
          ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
        }

        // 2. Concentric Orbit Rings
        [0.25, 0.42, 0.65, 0.88, 1.15].forEach((mul, idx) => {
          ctx.strokeStyle = `rgba(255, 122, 24, ${0.08 + idx * 0.03})`;
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.arc(cx, cy, maxR * mul, 0, Math.PI * 2);
          ctx.stroke();
        });

        // 3. Floating Hexagonal Lock Reticle on the right
        const hexX = cx + Math.min(w * 0.36, 420);
        const hexY = cy;
        const hexR = 54;

        // Concentric Orbit Circles behind Lock
        [35, 55, 75, 95].forEach((r, i) => {
          ctx.strokeStyle = `rgba(255, 122, 24, ${0.12 + i * 0.04})`;
          ctx.beginPath();
          ctx.arc(hexX, hexY, r, 0, Math.PI * 2);
          ctx.stroke();
        });

        // Hexagon Outline
        ctx.strokeStyle = 'rgba(255, 140, 40, 0.55)';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        for (let i = 0; i < 6; i++) {
          const a = (i * Math.PI) / 3;
          const px = hexX + Math.cos(a) * hexR;
          const py = hexY + Math.sin(a) * hexR;
          if (i === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        }
        ctx.closePath();
        ctx.stroke();

        // Lock Icon Inside Hexagon
        ctx.fillStyle = 'rgba(255, 140, 40, 0.6)';
        ctx.font = '22px "Space Grotesk", sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('🔒', hexX, hexY);

        angle += 0.005;
        requestAnimationFrame(render);
      }
      render();
    })();
  </script>
</body>
</html>
