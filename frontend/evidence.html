<!DOCTYPE html>
<html lang="en" data-motion="full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#050611" />
  <meta name="description" content="Nebulon Evidence Vault — Trustworthy multi-source provenance, CelesTrak, SatNOGS, and 4-tier timestamps." />
  <title>Evidence Vault — Nebulon</title>

  <!-- Core Design System -->
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/reset.css" />
  <link rel="stylesheet" href="css/typography.css" />
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/navbar.css" />
  <link rel="stylesheet" href="css/video-slots.css" />
  <link rel="stylesheet" href="css/motion.css" />
  <link rel="stylesheet" href="css/accessibility.css" />
  <link rel="stylesheet" href="pages/evidence/evidence.css" />

  <!-- Instant 2-Step Verification Guard -->
  <script>
    (function () {
      var s1 = sessionStorage.getItem('nebulon_step1_cleared') === 'true';
      var s2 = sessionStorage.getItem('nebulon_member_verified') === 'true';
      if (!s1) {
        window.location.href = 'authentication.html';
      } else if (!s2) {
        window.location.href = 'member_login.html';
      }
    })();
  </script>
</head>

<body data-page="evidence">
  <a class="skip-link" href="#main-content">Skip to main content</a>
  <div id="site-background" aria-hidden="true"></div>

  <!-- Full-Screen 3D Background Video -->
  <div class="video-slot video-slot--evidence" data-video-slot="evidence">
    <video class="video-slot__media" autoplay muted loop playsinline preload="metadata" aria-hidden="true">
      <source src="assets/video/evidence-loop.mp4" type="video/mp4" />
    </video>
  </div>

  <!-- Shared Fixed Navbar -->
  <header id="nebula-navbar" class="nebula-navbar"></header>

  <main id="main-content" tabindex="-1">
    <div class="n-container" style="padding-top: 1.5rem;">
      <div class="n-section-head">
        <div class="n-section-head__title-group">
          <div>
            <span class="n-kicker">PROVENANCE & AUDIT ARCHIVE</span>
            <h2>Multi-Source Evidence Vault</h2>
          </div>
          <span class="n-muted" style="font-family: var(--n-font-mono); font-size: 0.75rem;">Strict timestamp separation and upstream cryptographic auditability</span>
        </div>
      </div>

      <!-- Main Layout -->
      <div class="evidence-layout">
        <!-- Left: Filter Rail -->
        <aside class="n-panel evidence-filter-panel n-panel--strong">
          <span class="n-label-micro">SOURCE FILTERS</span>
          <div class="evidence-source-list" style="margin-top: 12px;">
            <button type="button" class="evidence-source-btn is-active" data-source-filter="all">
              <span>All Sources</span>
              <span class="n-chip">24</span>
            </button>
            <button type="button" class="evidence-source-btn" data-source-filter="satnogs">
              <span>SatNOGS RF</span>
              <span class="n-chip n-chip--cyan">Live</span>
            </button>
            <button type="button" class="evidence-source-btn" data-source-filter="celestrak">
              <span>CelesTrak GP</span>
              <span class="n-chip n-chip--cyan">Live</span>
            </button>
            <button type="button" class="evidence-source-btn" data-source-filter="spacetrack">
              <span>Space-Track</span>
              <span class="n-chip">TLE</span>
            </button>
            <button type="button" class="evidence-source-btn" data-source-filter="manifest">
              <span>Launch Manifest</span>
              <span class="n-chip">Static</span>
            </button>
          </div>
        </aside>

        <!-- Center: Evidence Chronological Timeline -->
        <div class="n-panel evidence-timeline-panel n-panel--strong">
          <div style="display: flex; justify-content: space-between; align-items: center;">
            <span class="n-chip n-chip--cyan">Chronological Audit Sequence</span>
            <span class="n-muted" style="font-family: var(--n-font-mono); font-size: 0.72rem;">Click any record to inspect provenance</span>
          </div>

          <div class="evidence-timeline-list" id="evidence-timeline-container">
            <!-- Rendered by evidence.js -->
          </div>
        </div>

        <!-- Right: Provenance Inspector Drawer -->
        <div class="n-panel evidence-inspector-panel n-panel--strong">
          <div id="evidence-provenance-body">
            <!-- Populated by evidence.js -->
          </div>
        </div>
      </div>
    </div>
  </main>

  <div id="live-announcer" class="sr-only" aria-live="polite"></div>

  <!-- Scripts -->
  <script src="js/authentication.js"></script>
  <script src="js/data-formatters.js" defer></script>
  <script src="js/api-client.js" defer></script>
  <script src="js/live-stream.js" defer></script>
  <script src="js/video-controller.js" defer></script>
  <script src="js/motion-controller.js" defer></script>
  <script src="js/app-shell.js" defer></script>
  <script src="pages/evidence/evidence.js" defer></script>
</body>
</html>
